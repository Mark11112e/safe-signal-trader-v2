services:
  postgres:
    image: postgres:16-alpine
    container_name: signalbot-postgres
    environment:
      POSTGRES_USER: signalbot
      POSTGRES_PASSWORD: signalbot
      POSTGRES_DB: signalbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalbot -d signalbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
