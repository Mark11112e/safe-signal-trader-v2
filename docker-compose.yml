services:
  postgres:
    image: postgres:16-alpine
    container_name: sst-postgres
    environment:
      POSTGRES_USER: signalbot
      POSTGRES_PASSWORD: signalbot
      POSTGRES_DB: signalbot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalbot -d signalbot"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
