[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signal-bot"
version = "0.1.0"
description = "Modular, safety-first Telegram signal trading bot with multi-source, multi-exchange support"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Lead Software Architect" },
]
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.5",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.111",
    "respx>=0.21",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-python-dateutil",
]
telethon = [
    "telethon>=1.36",
]

[project.scripts]
signal-bot = "signal_bot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "unit: Unit tests (no network, no DB)",
    "integration: Integration tests (DB allowed, no external network)",
    "golden: Golden-file tests for parsers",
    "conformance: Adapter conformance tests",
    "no_network: Guard against accidental network calls",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["telethon.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/signal_bot"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
