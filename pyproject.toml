[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safe-signal-trader"
version = "0.1.0"
description = "Modular, safety-first Telegram signal trading bot for futures"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Mark11112e" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
signal-bot = "signal_bot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "unit: pure unit tests (no network, no DB)",
    "integration: requires DB / docker",
]

[tool.ruff]
line-length = 100
target-version = "py312"
